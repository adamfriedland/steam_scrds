name: Deploy Azure Kubernetes Service

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/deploy-aks.yml'
      - 'infra/aks.bicep'
      - 'infra/aks-workload.yaml'
  workflow_dispatch:
    inputs:
      action:
        description: Select the operation to run
        required: true
        type: choice
        options:
          - provision
          - deprovision

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-manual-approval
  cancel-in-progress: false

jobs:
  provision:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'provision'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required settings
        shell: bash
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || { echo "::error::Set the AZURE_CLIENT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_TENANT_ID }}" || { echo "::error::Set the AZURE_TENANT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || { echo "::error::Set the AZURE_SUBSCRIPTION_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_RESOURCE_GROUP }}" || { echo "::error::Set the AZURE_RESOURCE_GROUP secret."; exit 1; }
          test -n "${{ secrets.ACR_RESOURCE_ID }}" || { echo "::error::Set the ACR_RESOURCE_ID secret."; exit 1; }
          test -n "${{ secrets.ACR_LOGIN_SERVER }}" || { echo "::error::Set the ACR_LOGIN_SERVER secret."; exit 1; }
          test -n "${{ secrets.AKS_MANAGED_IDENTITY_RESOURCE_ID }}" || { echo "::error::Set the AKS_MANAGED_IDENTITY_RESOURCE_ID secret."; exit 1; }

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision AKS cluster
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACR_RESOURCE_ID: ${{ secrets.ACR_RESOURCE_ID }}
          AKS_IDENTITY_RESOURCE_ID: ${{ secrets.AKS_MANAGED_IDENTITY_RESOURCE_ID }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          LOCATION: ${{ vars.AZURE_LOCATION || 'southafricanorth' }}
          CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'hl2dm-aks' }}
        with:
          inlineScript: |
            az deployment group create \
              --name "aks-${{ github.run_id }}" \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra/aks.bicep \
              --parameters \
                location="$LOCATION" \
                clusterName="$CLUSTER_NAME" \
                managedIdentityResourceId="$AKS_IDENTITY_RESOURCE_ID"

            IDENTITY_OBJECT_ID=$(az identity show \
              --ids "$AKS_IDENTITY_RESOURCE_ID" \
              --query principalId \
              --output tsv)
            ROLE_ASSIGNMENT_ID=$(az role assignment list \
              --assignee-object-id "$IDENTITY_OBJECT_ID" \
              --scope "$ACR_RESOURCE_ID" \
              --role Container Registry Repository Writer \
              --query '[0].id' \
              --output tsv)
            if [ -z "$ROLE_ASSIGNMENT_ID" ]; then
              az role assignment create \
                --assignee-object-id "$IDENTITY_OBJECT_ID" \
                --assignee-principal-type ServicePrincipal \
                --role Container Registry Repository Writer \
                --scope "$ACR_RESOURCE_ID"
            fi

            az aks get-credentials \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CLUSTER_NAME" \
              --overwrite-existing

            sed "s|\${ACR_LOGIN_SERVER}|$ACR_LOGIN_SERVER|g" infra/aks-workload.yaml | kubectl apply -f -
            kubectl rollout status deployment/steam-scrds --timeout=10m
            kubectl wait --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' service/steam-scrds --timeout=10m
            kubectl get service steam-scrds

  deprovision:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deprovision'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Validate required settings
        shell: bash
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || { echo "::error::Set the AZURE_CLIENT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_TENANT_ID }}" || { echo "::error::Set the AZURE_TENANT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || { echo "::error::Set the AZURE_SUBSCRIPTION_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_RESOURCE_GROUP }}" || { echo "::error::Set the AZURE_RESOURCE_GROUP secret."; exit 1; }

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deprovision AKS cluster
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'hl2dm-aks' }}
        with:
          inlineScript: |
            az aks delete \
              --name "$CLUSTER_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --yes
