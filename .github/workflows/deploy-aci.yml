name: Deploy Azure Container Instance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Select the operation to run
        required: true
        type: choice
        options:
          - provision
          - deprovision

permissions:
  contents: read
  id-token: write

concurrency:
  group: aci-manual-approval
  cancel-in-progress: false

jobs:
  provision:
    if: github.event.inputs.action == 'provision'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required settings
        shell: bash
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || { echo "::error::Set the AZURE_CLIENT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_TENANT_ID }}" || { echo "::error::Set the AZURE_TENANT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || { echo "::error::Set the AZURE_SUBSCRIPTION_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_RESOURCE_GROUP }}" || { echo "::error::Set the AZURE_RESOURCE_GROUP secret."; exit 1; }

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure Container Instance
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --name "aci-${{ github.run_id }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/content.bicep \
              --parameters \
                location="${{ vars.AZURE_LOCATION || 'southafricanorth' }}" \
                imageUsername="${{ secrets.ACR_USERNAME }}" \
                imageRegistryLoginServer="${{ secrets.ACR_LOGIN_SERVER }}" \
                containerName="${{ vars.ACI_CONTAINER_NAME || 'hl2dm' }}"

  deprovision:
    if: github.event.inputs.action == 'deprovision'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Validate required settings
        shell: bash
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || { echo "::error::Set the AZURE_CLIENT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_TENANT_ID }}" || { echo "::error::Set the AZURE_TENANT_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || { echo "::error::Set the AZURE_SUBSCRIPTION_ID secret."; exit 1; }
          test -n "${{ secrets.AZURE_RESOURCE_GROUP }}" || { echo "::error::Set the AZURE_RESOURCE_GROUP secret."; exit 1; }

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deprovision Azure Container Instance
        uses: azure/cli@v2
        with:
          inlineScript: |
            az container delete \
              --name "${{ vars.ACI_CONTAINER_NAME || 'hl2dm' }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --yes
