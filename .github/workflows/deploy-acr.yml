name: Deploy and publish container image

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/deploy-acr.yml'
      - 'cfg/**'
      - 'dockerfile'
      - 'entrypoint.sh'
      - 'infra/acr.bicep'
      - 'maps/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-and-publish:
    runs-on: ubuntu-latest
    environment: Production
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$ACR_NAME" || { echo "::error::Set the ACR_NAME GitHub secret."; exit 1; }
          test -n "$AZURE_LOCATION" || { echo "::error::Set the AZURE_LOCATION GitHub secret."; exit 1; }
          test -n "$AZURE_RESOURCE_GROUP" || { echo "::error::Set the AZURE_RESOURCE_GROUP GitHub secret."; exit 1; }
          test -n "$RCON_PASSWORD" || { echo "::error::Set the RCON_PASSWORD GitHub secret."; exit 1; }

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container registry
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --name "acr-${{ github.run_id }}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/acr.bicep \
              --parameters \
                registryName="$ACR_NAME" \
                location="$AZURE_LOCATION" \
                registrySku="${{ vars.ACR_SKU || 'Basic' }}" \
                publicNetworkAccess="${{ vars.ACR_PUBLIC_NETWORK_ACCESS || 'Enabled' }}" \
                zoneRedundancy="${{ vars.ACR_ZONE_REDUNDANCY || 'Disabled' }}" \
                dataEndpointEnabled="${{ vars.ACR_DATA_ENDPOINT_ENABLED || 'false' }}"

      - name: Build and publish image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr build \
              --registry "$ACR_NAME" \
              --file dockerfile \
              --secret-build-arg "RCON_PASSWORD=$RCON_PASSWORD" \
              --image "steam-scrds:${{ github.sha }}" \
              --image steam-scrds:latest \
              .
