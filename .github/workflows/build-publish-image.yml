name: Build and Publish Container Image

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-publish-image.yml'
      - 'dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: Production
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image build configuration
        shell: bash
        run: |
          test -n "$ACR_NAME" || { echo "::error::Set the ACR_NAME GitHub secret."; exit 1; }
          test -n "$RCON_PASSWORD" || { echo "::error::Set the RCON_PASSWORD GitHub secret."; exit 1; }

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr build \
              --registry "$ACR_NAME" \
              --file dockerfile \
              --source-acr-auth-id "[caller]" \
              --secret-build-arg "RCON_PASSWORD=$RCON_PASSWORD" \
              --image steam-scrds:latest \
              .
